services:
  postgres:
    image: postgres:17
    container_name: recursia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recursia

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - recursia_dados:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recursia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  recursia_dados: